[project]
name = "convos-explore"
version = "0.9.2"
description = "Local semantic navigation across conversations in convos"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["convos>=0.9,<0.10", "typer>=0.12.0"]

[project.urls]
Documentation = "https://github.com/RobertBiehl/convos/blob/master/docs/explore.md"
Repository = "https://github.com/RobertBiehl/convos"

[project.entry-points."convos.commands"]
explore = "ai_convos_explore:register"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
convos = { workspace = true }
