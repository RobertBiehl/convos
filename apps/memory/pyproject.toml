[project]
name = "convos-memory"
version = "0.11.6b3"
description = "Cross-provider memory revision tracking and agent-assisted synchronization for convos"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["convos>=0.11,<0.12", "typer>=0.12.0"]

[project.urls]
Documentation = "https://github.com/RobertBiehl/convos/blob/master/docs/memory.md"
Repository = "https://github.com/RobertBiehl/convos"

[project.entry-points."convos.commands"]
memory = "ai_convos_memory:register"

[project.entry-points."convos.init"]
memory = "ai_convos_memory:initialize"

[project.entry-points."convos.doctor"]
memory = "ai_convos_memory:doctor_status"

[project.entry-points."convos.remote"]
memory = "ai_convos_memory:remote_bridge"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
convos = { workspace = true }
