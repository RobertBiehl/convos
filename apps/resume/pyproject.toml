[project]
name = "convos-resume"
version = "0.10.0"
description = "Deterministic project handoff and session replay from exact conversation evidence"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["convos>=0.10,<0.11", "convos-redact>=0.10,<0.11", "typer>=0.12.0"]

[project.urls]
Documentation = "https://github.com/RobertBiehl/convos/blob/master/docs/resume.md"
Repository = "https://github.com/RobertBiehl/convos"

[project.entry-points."convos.commands"]
resume = "ai_convos_resume:register"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
convos = { workspace = true }
convos-redact = { workspace = true }
