[project]
name = "convos-orchestrate"
version = "0.11.6b38"
description = "Agentic IDE for Convos: a durable home for agent sessions, their work items, results, and conversations"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["convos>=0.11.6b38,<0.12", "typer>=0.12.0"]

[project.urls]
Documentation = "https://github.com/RobertBiehl/convos/blob/master/docs/orchestrate.md"
Repository = "https://github.com/RobertBiehl/convos"

[project.entry-points."convos.commands"]
orchestrate = "ai_convos_orchestrate:register"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_convos_orchestrate = ["SKILL.md", "web/*", "web/vendor/*"]

[tool.uv.sources]
convos = { workspace = true }
