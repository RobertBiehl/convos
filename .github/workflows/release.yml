name: release

on:
  release:
    types: [published]

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CONVOS_PROJECT_ROOT: ${{ runner.temp }}/external-convos
      CODEX_HOME: ${{ runner.temp }}/external-codex
      CLAUDE_CONFIG_DIR: ${{ runner.temp }}/external-claude
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run pytest -m "not integration" -q
      - name: Verify test state isolation
        run: |
          for path in "$CONVOS_PROJECT_ROOT" "$CODEX_HOME" "$CLAUDE_CONFIG_DIR"; do
            test ! -e "$path" || test -z "$(find "$path" -mindepth 1 -print -quit)"
          done
      - run: uv build --all-packages
      - run: bash scripts/smoke-wheel.sh dist/convos-*.whl
      - name: Stage public distributions
        run: |
          mkdir -p publish/convos publish/convos-redact publish/convos-remote publish/convos-remote-server
          cp dist/convos-*.whl dist/convos-*.tar.gz publish/convos/
          cp dist/convos_redact-*.whl dist/convos_redact-*.tar.gz publish/convos-redact/
          cp dist/convos_remote-*.whl dist/convos_remote-*.tar.gz publish/convos-remote/
          cp dist/convos_remote_server-*.whl dist/convos_remote_server-*.tar.gz publish/convos-remote-server/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dists
          path: publish/
          if-no-files-found: error

  publish-convos:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/convos/
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dists
          path: dist/
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: dist/convos/
          skip-existing: true

  publish-redact:
    needs: publish-convos
    runs-on: ubuntu-latest
    environment:
      name: pypi-redact
      url: https://pypi.org/project/convos-redact/
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dists
          path: dist/
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: dist/convos-redact/
          skip-existing: true

  publish-remote:
    needs: publish-redact
    runs-on: ubuntu-latest
    environment:
      name: pypi-remote
      url: https://pypi.org/project/convos-remote/
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dists
          path: dist/
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: dist/convos-remote/
          skip-existing: true

  publish-remote-server:
    needs: publish-remote
    runs-on: ubuntu-latest
    environment:
      name: pypi-remote-server
      url: https://pypi.org/project/convos-remote-server/
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dists
          path: dist/
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: dist/convos-remote-server/
          skip-existing: true
