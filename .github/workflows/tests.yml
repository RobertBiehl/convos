name: tests

on:
  workflow_call:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run pytest -m "not integration" -q
        env:
          CONVOS_PROJECT_ROOT: ${{ runner.temp }}/external-convos
          CODEX_HOME: ${{ runner.temp }}/external-codex
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/external-claude
      - name: Verify test state isolation
        env:
          CONVOS_PROJECT_ROOT: ${{ runner.temp }}/external-convos
          CODEX_HOME: ${{ runner.temp }}/external-codex
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/external-claude
        run: |
          for path in "$CONVOS_PROJECT_ROOT" "$CODEX_HOME" "$CLAUDE_CONFIG_DIR"; do
            test ! -e "$path" || test -z "$(find "$path" -mindepth 1 -print -quit)"
          done
      - run: uv build --wheel
      - run: bash scripts/smoke-wheel.sh dist/convos-*.whl

  customer-lifecycle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv build --all-packages --wheel
      - name: Install customer packages
        run: |
          uv venv "$RUNNER_TEMP/customer-install"
          uv pip install --python "$RUNNER_TEMP/customer-install/bin/python" dist/*.whl
      - name: Capture, synchronize, remove worktrees, and re-import
        run: uv run python scripts/remote_testbed.py desktop --root "$RUNNER_TEMP/customer-lifecycle" --venv "$RUNNER_TEMP/customer-install" --commit "$GITHUB_SHA"
      - name: Repeat against accumulated customer state
        run: uv run python scripts/remote_testbed.py desktop --root "$RUNNER_TEMP/customer-lifecycle" --venv "$RUNNER_TEMP/customer-install" --commit "$GITHUB_SHA"
      - name: Check out released upgrade baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v0.11.6b11
          path: .baseline-b11
      - name: Install released baseline
        working-directory: .baseline-b11
        run: uv sync --locked --extra dev
      - name: Prove the customer scenario detects released divergence
        run: |
          if uv run python scripts/remote_testbed.py desktop --root "$RUNNER_TEMP/customer-upgrade" --venv "$GITHUB_WORKSPACE/.baseline-b11/.venv" --commit v0.11.6b11; then
            exit 1
          fi
          uv run python -c 'import json,os,pathlib; r=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"customer-upgrade/testbed.json").read_text())["runs"][-1]; assert not r["success"] and "expected 2 exact Codex turns, got 4" in r["error"], r'
      - name: Upgrade the retained archives through mixed client versions
        run: uv run python scripts/remote_testbed.py desktop --root "$RUNNER_TEMP/customer-upgrade" --venv "$RUNNER_TEMP/customer-install" --baseline-venv "$GITHUB_WORKSPACE/.baseline-b11/.venv" --commit "$GITHUB_SHA"
      - name: Preserve qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: customer-lifecycle-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/customer-lifecycle/testbed.json
            ${{ runner.temp }}/customer-lifecycle/run-*/*.log
            ${{ runner.temp }}/customer-lifecycle/run-*/*.json
            ${{ runner.temp }}/customer-upgrade/testbed.json
            ${{ runner.temp }}/customer-upgrade/run-*/*.log
            ${{ runner.temp }}/customer-upgrade/run-*/*.json
