[project]
name = "convos"
version = "0.11.3"
description = "Queryable memory for coding agents, backed by exact conversation evidence"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.2.0",
    "typer>=0.12.0",
    "cryptography>=42.0.0",
    "llama-cpp-python>=0.3.0; sys_platform == 'darwin'",
    "huggingface-hub>=0.20.0; sys_platform == 'darwin'",
]

[project.urls]
Documentation = "https://github.com/RobertBiehl/convos#readme"
Issues = "https://github.com/RobertBiehl/convos/issues"
Repository = "https://github.com/RobertBiehl/convos"

[project.optional-dependencies]
semantic = ["llama-cpp-python>=0.3.0", "huggingface-hub>=0.20.0"]
redact = ["convos-redact>=0.11,<0.12"]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "huggingface-hub>=0.20.0", "convos-changegraph", "convos-explore", "convos-memory", "convos-redact", "convos-resume", "convos-remote", "convos-remote-server"]

[project.scripts]
convos = "ai_convos:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/convos/skills/convos" = ["skills/convos/SKILL.md"]

[tool.uv]
package = true

[tool.uv.workspace]
members = ["apps/*"]

[tool.uv.sources]
convos-changegraph = { workspace = true }
convos-explore = { workspace = true }
convos-memory = { workspace = true }
convos-redact = { workspace = true }
convos-resume = { workspace = true }
convos-remote-server = { workspace = true }
convos-remote = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: marks tests as integration tests (may hit real APIs)", "slow: marks tests as slow"]
